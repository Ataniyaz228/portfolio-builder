# ============================================
# Docker Compose — Production Environment
# ============================================
# Использование:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Отличия от dev:
# - Нет pgAdmin
# - restart: always (автоперезапуск при краше)
# - Ограничение ресурсов (memory, CPU)
# - Нет hot-reload volumes
# - Все секреты через environment переменные
# ============================================

services:
  # ==========================================
  # PostgreSQL — Production Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-db-prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./portfolio-backend/src/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    # НЕ выставляем порт наружу в production!
    # Доступ к БД только через внутреннюю Docker-сеть

  # ==========================================
  # Backend — Production API
  # ==========================================
  backend:
    build:
      context: ./portfolio-backend
      dockerfile: Dockerfile
    container_name: portfolio-backend-prod
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 3000
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    # НЕ выставляем порт наружу — Nginx проксирует

  # ==========================================
  # Frontend — Nginx + React (Production)
  # ==========================================
  frontend:
    build:
      context: ./portfolio-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: portfolio-frontend-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

volumes:
  postgres_data_prod:
    driver: local
