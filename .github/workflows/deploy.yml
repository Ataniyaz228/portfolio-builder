# ============================================
# Deploy Pipeline — Push to Main
# ============================================
# Запускается при push в ветку main.
# 1. Собирает Docker образы
# 2. Пушит в GitHub Container Registry (GHCR)
# 3. Деплоит на сервер по SSH
# 4. Запускает миграции и healthcheck
#
# Необходимые секреты в GitHub Settings → Secrets:
# - DEPLOY_HOST: IP или домен сервера
# - DEPLOY_USER: SSH пользователь
# - DEPLOY_KEY: SSH приватный ключ
# - DEPLOY_PATH: Путь к проекту на сервере
# - ENV_FILE: Содержимое .env файла для production
# ============================================

name: Deploy — Production

on:
  push:
    branches: [main]

  # Позволяет запустить вручную
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  # ==========================================
  # 1. Build & Push Docker Images
  # ==========================================
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./portfolio-backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./portfolio-frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 2. Deploy to Server via SSH
  # ==========================================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    # Деплой только если build прошёл успешно
    if: success()

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: 🚀 Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'DEPLOY_SCRIPT'
            set -e

            echo "📂 Переходим в директорию проекта..."
            cd ${{ secrets.DEPLOY_PATH }}

            echo "📥 Обновляем код..."
            git pull origin main

            echo "🔐 Авторизация в GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "📥 Скачиваем новые образы..."
            docker compose -f docker-compose.prod.yml pull

            echo "🚀 Запускаем обновлённые контейнеры..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "⏳ Ожидаем запуск сервисов (15 секунд)..."
            sleep 15

            echo "🏥 Проверяем здоровье сервисов..."
            curl -sf http://localhost:3000/api/health || (echo "❌ Backend health check failed!" && exit 1)
            curl -sf http://localhost:80/ || (echo "❌ Frontend health check failed!" && exit 1)

            echo "🧹 Очищаем старые образы..."
            docker image prune -f

            echo "✅ Деплой завершён успешно!"
          DEPLOY_SCRIPT

      - name: ❌ Notify on failure
        if: failure()
        run: |
          echo "::error::Деплой на production ПРОВАЛИЛСЯ! Проверьте логи."
          # Раскомментируйте для уведомлений в Telegram:
          # curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          #   -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          #   -d text="❌ Деплой провалился! Commit: ${{ github.sha }}"
